[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "grid-carbon"
version = "0.1.0"
description = "Time-of-use marginal grid carbon intensity & solar-peak batch workload scheduler quantifying exact gCO2eq emissions and tariff cost savings for ML, CI, and ETL jobs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "carbon-aware",
    "green-software",
    "sustainability",
    "renewable-energy",
    "scheduler",
    "mlops",
    "climate",
    "energy-efficiency",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
grid-carbon = "grid_carbon.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/grid-carbon"
Repository = "https://github.com/codesphere-u/grid-carbon"
Issues = "https://github.com/codesphere-u/grid-carbon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_carbon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["grid_carbon"]
